# Tests, lint and dependency audits for trading-platform/. Nothing here deploys.
name: trading-platform

on:
  push:
    paths:
      - "trading-platform/**"
      - ".github/workflows/trading-platform.yml"
  pull_request:
    paths:
      - "trading-platform/**"
      - ".github/workflows/trading-platform.yml"

permissions:
  contents: read

concurrency:
  group: trading-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trading-platform/backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-superuser
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://tp_app:ci-app@127.0.0.1:5432/tradeplatform_test
      TEST_MIGRATIONS_DATABASE_URL: postgresql+psycopg://tp_owner:ci-owner@127.0.0.1:5432/tradeplatform_test
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: trading-platform/backend/requirements-dev.lock
      - name: Install dependencies
        run: pip install -r requirements-dev.lock
      - name: Create the restricted database roles the tests run as
        env:
          PGPASSWORD: ci-superuser
        run: |
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE tp_owner LOGIN PASSWORD 'ci-owner' NOSUPERUSER NOBYPASSRLS;
          CREATE ROLE tp_app LOGIN PASSWORD 'ci-app' NOSUPERUSER NOBYPASSRLS;
          CREATE DATABASE tradeplatform_test OWNER tp_owner;
          SQL
      - name: Lint and format check
        run: |
          ruff check app tests migrations
          ruff format --check app tests migrations
      - name: Tests
        run: pytest
      - name: Audit Python dependencies for known vulnerabilities
        run: pip-audit -r requirements.lock

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trading-platform/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: trading-platform/frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npx eslint .
      - name: Type check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Audit runtime dependencies for known vulnerabilities
        run: npm audit --omit=dev --audit-level=high
