[project]
name = "trading-platform-backend"
version = "0.1.0"
description = "API, signal processing and execution services for the trading automation platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "argon2-cffi>=23.1",
    "cryptography>=42",
    "pyotp>=2.9",
    "redis>=5.0",
    "sentry-sdk>=2.0",
    "httpx>=0.27",  # Zerodha Kite Connect client
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "pip-audit>=2.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = [
    "S101",  # asserts are fine in tests and for invariants
    "B008",  # FastAPI's Depends() in defaults is the framework's idiom
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S608"]
"migrations/*" = ["S608"]
