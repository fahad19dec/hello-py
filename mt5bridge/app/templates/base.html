<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MT5 Bridge</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1c2330; --muted:#667085; --line:#e3e6eb; --accent:#1f6feb; --ok:#18794e; --bad:#c62828; --warn:#9a6700; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--text); }
  header { background:var(--card); border-bottom:1px solid var(--line); padding:12px 16px; display:flex; justify-content:space-between; align-items:center; }
  header strong { font-size:17px; }
  main { max-width:1000px; margin:0 auto; padding:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:16px; margin-bottom:16px; }
  h2 { font-size:16px; margin:0 0 12px; }
  .muted { color:var(--muted); font-size:13px; }
  .flash { background:#fff8e1; border:1px solid #f0d58c; border-radius:8px; padding:10px 14px; margin-bottom:16px; }
  code, pre { font:13px ui-monospace, monospace; background:#f0f2f5; border-radius:4px; }
  code { padding:2px 5px; word-break:break-all; }
  pre { padding:10px; overflow-x:auto; margin:8px 0; }
  .scroll { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:7px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
  td.wrap { white-space:normal; min-width:180px; }
  th { color:var(--muted); font-weight:600; font-size:12px; text-transform:uppercase; }
  input { font:inherit; padding:7px 9px; border:1px solid var(--line); border-radius:6px; width:100%; }
  label { display:block; font-size:13px; color:var(--muted); margin-bottom:10px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(170px, 1fr)); gap:0 12px; }
  button { font:inherit; padding:7px 12px; border:1px solid var(--accent); background:var(--accent); color:#fff; border-radius:6px; cursor:pointer; }
  button.plain { background:transparent; color:var(--accent); border-color:var(--line); padding:4px 9px; font-size:13px; }
  button.danger { color:var(--bad); }
  form.inline { display:inline; }
  .tag { display:inline-block; padding:1px 8px; border-radius:10px; font-size:12px; font-weight:600; background:#eef0f3; color:var(--muted); }
  .tag.connected, .tag.filled { background:#e3f5ea; color:var(--ok); }
  .tag.error, .tag.failed, .tag.rejected { background:#fde8e8; color:var(--bad); }
  .tag.expired, .tag.claimed, .tag.queued { background:#fff4d6; color:var(--warn); }
  .narrow { max-width:380px; margin:48px auto; }
</style>
</head>
<body>
<header>
  <strong>MT5 Bridge</strong>
  {% if user %}
  <form class="inline" method="post" action="/logout"><span class="muted">{{ user.email }}</span> <button class="plain">Log out</button></form>
  {% endif %}
</header>
<main>
  {% if flash %}<div class="flash">{{ flash }}</div>{% endif %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
